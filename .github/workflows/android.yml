name: Nebula Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f nebula-android-source.tar.xz || {
            echo "::error::nebula-android-source.tar.xz is missing from the repository root."
            exit 1
          }

      - name: Extract Android project
        run: |
          mkdir -p source
          tar -xJf nebula-android-source.tar.xz -C source
          test -f source/settings.gradle.kts
          test -f source/build.gradle.kts
          test -f source/app/build.gradle.kts
          echo "Project source extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Compile Kotlin
        run: gradle -p source --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle -p source --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nebula-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: gradle -p source --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-unit-test-reports
          path: source/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report test status
        if: steps.tests.outcome == 'failure'
        run: echo "::warning::Unit tests failed. The APK artifact was already uploaded."
