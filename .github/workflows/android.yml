name: Nebula Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'source-chunks/**'
  pull_request:
    paths:
      - 'source-chunks/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify Android source archive
        run: |
          set -euo pipefail
          test -d source-chunks
          shopt -s nullglob
          chunks=(source-chunks/part-*.bin)
          test "${#chunks[@]}" -eq 11
          cat "${chunks[@]}" > nebula-android-source.tar.xz
          echo "a15c8798a8bbf7199bc319a7f38254214120f9ced898980707f4cad33cb98a23  nebula-android-source.tar.xz" | sha256sum --check
          mkdir -p source
          tar -xJf nebula-android-source.tar.xz -C source
          test -f source/settings.gradle.kts
          test -f source/build.gradle.kts
          test -f source/app/build.gradle.kts
          echo "Verified and extracted Nebula Android source."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -eu
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gradle-8.9-bin.zip"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 240 "https://downloads.gradle.org/distributions/gradle-8.9-bin.zip" --output "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Compile Kotlin
        run: gradle -p source --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle -p source --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nebula-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: gradle -p source --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-unit-test-reports
          path: source/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report test status
        if: steps.tests.outcome == 'failure'
        run: echo "::warning::Unit tests failed. The debug APK artifact was already uploaded."
