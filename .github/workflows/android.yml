name: Nebula Android APK

on:
  push:
    branches: [main, master]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'gradle/**'
      - '.github/workflows/android.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Android project is in repository root
        run: |
          if [ ! -f settings.gradle.kts ] || [ ! -f app/build.gradle.kts ]; then
            echo "::error::Android project files are missing from repository root. Extract the contents of nebula-android-v0.0.2-fixed.zip into the repository root and commit them. Do not upload the ZIP as a nested archive."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Compile Kotlin
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nebula-v0.0.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report test status
        if: steps.tests.outcome == 'failure'
        run: echo "::warning::The APK was built, but one or more unit tests failed. Review the uploaded test report."
