name: Nebula Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'nebula-android.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Confirm source archive exists
        run: test -f nebula-android.zip

      - name: Extract Android project
        run: |
          mkdir -p build-source
          unzip -q nebula-android.zip -d build-source
          test -f build-source/nebula-android/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Kotlin
        working-directory: build-source/nebula-android
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Build debug APK
        working-directory: build-source/nebula-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        id: tests
        continue-on-error: true
        working-directory: build-source/nebula-android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nebula-v0.0.2-debug-apk
          path: build-source/nebula-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-unit-test-reports
          path: build-source/nebula-android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report test status
        if: steps.tests.outcome == 'failure'
        run: echo "::warning::APK built, but unit tests failed. Inspect the test report artifact."
